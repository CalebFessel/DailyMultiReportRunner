  /ThirdParty/Data/User/Users:
    get:
      summary: List User
      description: |
        Paginated list of user accounts.
        Excludes disabled users by default.
        `rows` defaults to 100 when omitted; when provided must be between 1 and 100 (400 otherwise).
        Optional `name` filters by first name, last name, or username (OR, LIKE; trimmed).
        Optional `fields[users]` selects a subset of allowlisted columns (JSON:API style).
        Field names are matched case-insensitively. Omit `fields[users]` for the full
        allowlisted response. Unknown field names are ignored.
        If `fields[users]` is provided and none are allowlisted, returns 422.
        A non-object `fields` value returns 422.
        Never returns SSN.
      tags:
      - User
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Paginated users list
          content:
            application/json:
              schema:
                type: object
                required:
                - users
                - current_page
                - total_pages
                - total_records
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  current_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_records:
                    type: integer
        '400':
          $ref: '#/components/responses/Error4xx'
        '422':
          $ref: '#/components/responses/Error4xx'
      parameters:
      - $ref: '#/components/parameters/page'
      - name: rows
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: |
          Page size for Users List. Defaults to 100 when omitted.
          Must be between 1 and 100 when provided.
      - $ref: '#/components/parameters/nameFilter'
      - $ref: '#/components/parameters/includeDisabled'
      - $ref: '#/components/parameters/fieldsUsers'
    post:
      summary: Create User
      description: |
        Create a user account.
        Required: first_name, last_name, user_role, division_id, district_id, group_id.
        Username is auto-generated when omitted.
        SSN and password may be supplied but are never returned.
        Optional HR fields: primary_cost_center_id, employee_num, hire_date, paycode,
        license_id, level_id, password (none required). Omit or empty → not applied.
        Provided FK IDs are validated (unknown IDs rejected with 422).
        division_id, district_id, and group_id must exist and form a valid
        Division→District→Group hierarchy (unknown or mismatched IDs → 422).
        When user_role is `employee`, employee permissions are granted automatically.
      tags:
      - User
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '201':
          description: Created user (SSN never included)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/Error4xx'
        '500':
          $ref: '#/components/responses/Error5xx'

  /ThirdParty/Data/User/Users/{id}:
    get:
      summary: Read User by ID
      description: |
        Single user by ID. Never returns SSN.
        Optional `fields[users]` selects a subset of allowlisted columns (JSON:API style).
        Field names are matched case-insensitively. Omit `fields[users]` for the full
        allowlisted response. Unknown field names are ignored.
        If `fields[users]` is provided and none are allowlisted, returns 422.
        A non-object `fields` value returns 422.
      tags:
      - User
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Single user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
      - $ref: '#/components/parameters/fieldsUsers'
    put:
      summary: Update User
      description: |
        Partial update of a user account.
        SSN and password may be supplied but are never returned.
        Optional HR fields: primary_cost_center_id, employee_num, hire_date, paycode,
        license_id, level_id, password (none required). Omit or empty → leave existing
        values unchanged. Provided FK IDs are validated (unknown IDs rejected with 422).
        When any of division_id, district_id, or group_id is sent, the resulting triplet
        (merged with existing values for omitted fields) must exist and form a valid
        Division→District→Group hierarchy (unknown or mismatched IDs → 422).
        Setting `termination_date` also sets `disabled=true` and `status=terminated`.
      tags:
      - User
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWrite'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Updated user (SSN never included)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
        '500':
          $ref: '#/components/responses/Error5xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
    delete:
      summary: Delete User
      description: |
        Soft-delete a user by setting `disabled` to true.
      tags:
      - User
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Soft-deleted user
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - disabled
                properties:
                  id:
                    type: integer
                  disabled:
                    type: boolean
                    enum:
                    - true
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
        '500':
          $ref: '#/components/responses/Error5xx'
      parameters:
      - $ref: '#/components/parameters/idPath'

