          nullable: true
          format: date
        disabled:
          type: boolean
        medical_license:
          type: array
          items:
            type: string
          description: med_num plus EPCR submit cert numbers.
    EmployeeLevel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
