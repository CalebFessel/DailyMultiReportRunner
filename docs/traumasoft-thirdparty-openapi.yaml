  /ThirdParty/Data/Fleet/Vehicles:
    get:
      summary: List Vehicle
      description: |
        Paginated vehicle list.
        `rows` defaults to 100 when omitted; when provided must be between 1 and 100 (400 otherwise).
        Optional `fields[vehicles]` selects a subset of allowlisted columns (JSON:API style).
        Field names are matched case-insensitively. Omit `fields[vehicles]` for the full
        allowlisted set (SQL columns + live-shift enrichment). Unknown names are ignored.
        If `fields[vehicles]` is provided and none are allowlisted, returns 422.
        Enrichment fields (`shift_name`, `trip_status`, `trip_timestamp`, `post_id`,
        `post_status`, `post_timestamp`) are returned only when requested (or when
        `fields[vehicles]` is omitted).
      tags:
      - Fleet
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JqGridPaginatorResponse'
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/Error4xx'
        '422':
          $ref: '#/components/responses/Error4xx'
      parameters:
      - $ref: '#/components/parameters/page'
      - name: rows
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: |
          Page size for Vehicles List. Defaults to 100 when omitted.
          Must be between 1 and 100 when provided.
      - $ref: '#/components/parameters/includeDeleted'
      - $ref: '#/components/parameters/includeDisabled'
      - $ref: '#/components/parameters/nameFilter'
      - $ref: '#/components/parameters/fieldsVehicles'
    post:
      summary: Create Vehicle
      description: |
        Create a vehicle.
        Required: name, division_id, district_id, group_id.
        VIN must be unique among non-deleted vehicles when supplied.
        `status` must reference an existing `vm_custom_status.id` when supplied.
        Writes a Layer 1 audit log entry on success.
        Response combines List default fields with writable request fields.
      tags:
      - Fleet
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '201':
          description: |
            Created vehicle: List default fields (including `vehicle_status` + enrichment)
            plus writable fields from the request (`status`, DDG, make/model/year/color/plate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleWriteResponse'
        '422':
          $ref: '#/components/responses/Error4xx'
        '500':
          $ref: '#/components/responses/Error5xx'
  /ThirdParty/Data/Fleet/Vehicles/{id}:
    get:
      summary: Read Vehicle by ID
      description: |
        Single vehicle by id.
        Optional `fields[vehicles]` selects a subset of allowlisted columns (JSON:API style).
        Field names are matched case-insensitively. Omit `fields[vehicles]` for the full
        SQL allowlisted columns plus the legacy Read enrichment set (`shift_name`,
        `trip_status`, `post_status` only — not trip/post timestamps or `post_id`).
        Unknown names are ignored.
        If `fields[vehicles]` is provided and none are allowlisted, returns 422.
        Enrichment fields are returned only when requested (or when `fields[vehicles]`
        is omitted, using the legacy Read enrichment set above).
      tags:
      - Fleet
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Single record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
      - $ref: '#/components/parameters/fieldsVehicles'
    put:
      summary: Update Vehicle
      description: |
        Partial update of a vehicle.
        VIN must be unique among non-deleted vehicles when supplied.
        `status` must reference an existing `vm_custom_status.id` when supplied.
        Name cannot be blank when provided.
        Writes a Layer 1 audit log entry on success.
        Response combines List default fields with writable request fields.
      tags:
      - Fleet
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleWrite'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: |
            Updated vehicle: List default fields (including `vehicle_status` + enrichment)
            plus writable fields (`status`, DDG, make/model/year/color/plate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleWriteResponse'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
        '500':
          $ref: '#/components/responses/Error5xx'
