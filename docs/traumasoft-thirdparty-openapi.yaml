components:
  securitySchemes:
    HmacApiKey:
      type: apiKey
      in: header
      name: X-TS-APIKEY
      description: Configured API Key.
    HmacTimestamp:
      type: apiKey
      in: header
      name: X-TS-TIMESTAMP
      description: Current UNIX timestamp (valid for 300 seconds).
    HmacNonce:
      type: apiKey
      in: header
      name: X-TS-ID
      description: Randomly generated number for every request.
    HmacAuthorization:
      type: apiKey
      in: header
      name: X-TS-AUTHORIZATION
      description: >
        This is the generated hmac hash.
        Default (most endpoints): hash_hmac('sha256', $requestBody . $timestamp . $randNum, $secret).
        Alternate (GPS Geofence / legacy): hash_hmac('sha256', $apiKey, $timestamp . $secret . $randNum).

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    rows:
      name: rows
      in: query
      schema:
        type: integer
        minimum: 0
      description: Page size. Omit or 0 to return all (where supported).
    search:
      name: search
      in: query
      schema:
        type: string
      description: Name search (Lists).
    nameFilter:
      name: name
      in: query
      schema:
        type: string
      description: Name filter.
    companyIdFilter:
      name: company_id
      in: query
      schema:
        type: integer
        minimum: 1
      description: |
        Exact match on `ibd_facilities.company_id`.
        Must be a positive integer when provided; otherwise the API returns 422.
        Resolve via GET /ThirdParty/Lists/Cad/Companies.
    includeDeleted:
      name: include_deleted
      in: query
      schema:
        type: boolean
        default: false
    includeDisabled:
      name: include_disabled
      in: query
      schema:
        type: boolean
        default: false
    fieldsUsers:
      name: fields[users]
      in: query
      required: false
      schema:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      description: |
        Optional allowlisted user fields (JSON:API style). Supported shapes:
        - comma-separated string: `fields[users]=id,first_name,last_name`
        - repeated array form: `fields[users][]=id&fields[users][]=first_name`
        Field names are matched case-insensitively against the allowlist.
        Omit for the full allowlisted response.
        Unknown names are silently ignored.
        If provided and none match the allowlist, the API returns 422.
        If `fields` is sent but is not an object (e.g. a bare string), the API returns 422.
        Allowlisted: id, username, first_name, last_name, email, user_role, status,
        division_id, district_id, group_id.
    fieldsFacilities:
      name: fields[facilities]
      in: query
      required: false
      schema:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      description: |
        Optional allowlisted facility fields (JSON:API style). Supported shapes:
        - comma-separated string: `fields[facilities]=facility_id,name,city`
        - repeated array form: `fields[facilities][]=facility_id&fields[facilities][]=name`
        Field names are matched case-insensitively against the allowlist.
        Omit for the full allowlisted response.
        Unknown names are silently ignored.
        If provided and none match the allowlist, the API returns 422.
        If `fields` is sent but is not an object (e.g. a bare string), the API returns 422.
        Allowlisted: facility_id, company_id, facility_type_id, name, dba, abbv, address1,
        address2, city, state, zipcode, county_code, phone, fax_number, email, lat, lon,
        default_zone_id, default_subzone_id, default_dispatch_subzone_id, external_code,
        npi, disabled, deleted.
    fieldsVehicles:
      name: fields[vehicles]
      in: query
      required: false
      schema:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      description: |
        Optional allowlisted vehicle fields (JSON:API style). Supported shapes:
        - comma-separated string: `fields[vehicles]=id,name,vin`
        - repeated array form: `fields[vehicles][]=id&fields[vehicles][]=name`
        Field names are matched case-insensitively against the allowlist.
        Omit for the full allowlisted response.
        Unknown names are silently ignored.
        If provided and none match the allowlist, the API returns 422.
        If `fields` is sent but is not an object (e.g. a bare string), the API returns 422.
        On List, `id` is always selected for the paginator row key and stripped from the
        response when not requested. On Read, `id` is selected only when requested or when
        enrichment fields require it (then stripped if not requested).
        Allowlisted SQL: id, name, vehicle_status, vin, odometer, disabled, deleted.
        Allowlisted enrichment: shift_name, trip_status, trip_timestamp, post_id,
        post_status, post_timestamp.
        Enrichment is returned only when those names are requested (or fields omitted).
        When fields are omitted: List returns all enrichment keys; Read returns only
        shift_name, trip_status, and post_status (legacy shape).
    fieldsPayors:
      name: fields[payors]
      in: query
      required: false
      schema:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      description: |
        Optional allowlisted payor fields (JSON:API style). Supported shapes:
        - comma-separated string: `fields[payors]=id,name,system_type`
        - repeated array form: `fields[payors][]=id&fields[payors][]=name`
        Field names are matched case-insensitively against the allowlist.
        Omit for the full allowlisted response.
        Unknown names are silently ignored.
        If provided and none match the allowlist, the API returns 422.
        If `fields` is sent but is not an object (e.g. a bare string), the API returns 422.
        On List, `id` is always selected for the paginator row key and stripped from the
        response when not requested. On Read, `id` is selected only when requested.
        Allowlisted: id, quick_code, name, billing_desc, address1, address2, city, state,
        zipcode, phone, fax, email, facility_id, category, system_type, default_source,
        primary_schedule, secondary_schedule, fee_schedule.
    includeInactive:
      name: include_inactive
      in: query
      schema:
        type: boolean
        default: false
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    rtype:
      name: rtype
      in: query
      required: true
      schema:
        type: string
  responses:
    Unauthorized401:
      description: Missing or invalid HMAC authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unauthorized
            errors:
              auth: Missing or invalid HMAC headers
    RateLimit429:
      description: >
        Rate limit exceeded when per-API-key limiting is enabled
        (typically 100 reads/min or 50 writes/min). Clients should back off and retry.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Suggested seconds to wait before retrying (commonly 60).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Rate limit exceeded
            errors:
              rate_limit: Too many requests. Retry after 60 seconds.
    Error4xx:
      description: Validation or business error (typically 400 or 422).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              summary: Validation error (422)
              value:
                message: Facility ID required
                errors: {}
            badRequest:
              summary: Bad request (400)
              value:
                message: "Parameter 'rows' must be sent and cannot be larger than 1000 rows."
                errors: {}
    Error5xx:
      description: Unexpected server error. Details are logged server-side; the client message is generic.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Failed to create vehicle
            errors: {}
    NotFound404:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Facility not found
            errors: {}
  schemas:
    AttachmentType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    AttachmentUploadFile:
      type: object
      required:
      - file_data
      - file_name
      - mime_type
      properties:
        file_data:
          type: string
          description: Base64-encoded file contents.
        file_name:
          type: string
          description: Filename (alphanumeric, underscore, dot, hyphen after sanitize).
        mime_type:
          type: string
          example: image/jpeg
        type_id:
          type: integer
          description: Attachment type. Resolve via GET /ThirdParty/Data/Attachments?rtype=GetTypes. Falls back to CAD auto_attachment_type when omitted.
        cad_leg_id:
          type: integer
          description: CAD trip leg id. No partner List lookup; obtain from trip/leg responses (e.g. Trip GetTrips / GetByOrigin). One of cad_leg_id, epcr_run_id, cad_run_number, or epcr_run_number is required.
        epcr_run_id:
          type: integer
          description: Internal ePCR run id (no partner Data/Lists lookup in this spec).
        cad_run_number:
          type: string
          description: Format RUNNUMBER-YY (e.g. 123456-26).
        epcr_run_number:
          type: string
    BillingSchedule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    CallType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        shortname:
          type: string
