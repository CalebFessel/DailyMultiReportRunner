        npi:
          type: string
        disabled:
          type: boolean
        contract_payor:
          type: string
          description: >
            Optional. If a FACILITY_CONTRACT CadPayors row with this name already
            exists, attach it (set facility.payor_id only; primary_schedule_id not
            required) unless that payor is already linked to another facility (422).
            Otherwise create a new FACILITY_CONTRACT and require primary_schedule_id.
        primary_schedule_id:
          type: integer
          description: >
            Required when contract_payor creates a new payor (name not found as
            FACILITY_CONTRACT). Must reference an existing billing schedule
            (resolve via GET /ThirdParty/Data/Billing/Schedules); unknown ids
            return 422. Not required when attaching an existing facility contract.
    FacilityWrite:
      type: object
      properties:
        name:
          type: string
        company_id:
          type: integer
          description: Optional. Resolve via GET /ThirdParty/Lists/Cad/Companies.
        facility_type_id:
          type: integer
          description: Resolve via GET /ThirdParty/Data/Cad/FacilityTypes.
        dba:
          type: string
        abbv:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        zipcode:
          type: string
        county_code:
          type: string
        country:
          type: string
        phone:
          type: string
        fax_number:
          type: string
        email:
          type: string
        lat:
          type: number
        lon:
          type: number
        default_zone_id:
          type: integer
        default_subzone_id:
          type: integer
        default_dispatch_subzone_id:
          type: integer
        external_code:
          type: string
        npi:
          type: string
        disabled:
          type: boolean
        contract_payor:
          type: string
          description: >
            When linked payor already has facility_id set, sending contract_payor
            to replace/rebind returns 422. Otherwise: attach existing FACILITY_CONTRACT
            by name, or create a new one (requires primary_schedule_id). Facility-only
            updates (without contract_payor) still sync an existing specific contract.
            Existing facility-contract payors are never mutated on attach.
        primary_schedule_id:
          type: integer
          description: >
            Required when contract_payor creates a new payor. Not required when
            attaching an existing FACILITY_CONTRACT by name. Must reference an
            existing billing schedule; unknown ids return 422.
