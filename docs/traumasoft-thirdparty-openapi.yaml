          type: string
          description: Value from `vm_custom_status.status`
        notify_group:
          type: string
          description: Domain key for this status (e.g. vehicles, equipment, vendors, work_orders).
    Department:
      type: object
      properties:
        dept_id:
          type: integer
        facility_id:
          type: integer
          description: Resolve via GET /ThirdParty/Data/Cad/Facilities.
        facility_type_id:
          type: integer
          description: Resolve via GET /ThirdParty/Data/Cad/FacilityTypes.
        dept:
          type: string
        phone:
          type: string
        fax:
          type: string
        email:
          type: string
        note:
          type: string
        deleted:
          type: string
    EarningCode:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Display label (`sched_earning_codes.description`).
        user_defined_code:
          type: string
        type:
          type: string
    Employee:
      type: object
      properties:
        user_id:
          type: integer
          description: Resolve via GET /ThirdParty/Data/User/Employees or Lists/User/Employees.
        employee_num:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        mobile_phone:
          type: string
        home_phone:
          type: string
        office_phone:
          type: string
        email_address:
          type: string
        hire_date:
          type: string
        termination_date:
          type: string
          nullable: true
          format: date
        paycode:
          type: string
        division:
          type: string
        license_level:
          type: string
        level:
          type: string
        med_num:
          type: string
        manager_id:
          type: integer
          description: Supervisor user_id. Resolve via GET /ThirdParty/Lists/User/Supervisors or Lists/User/Employees.
        manager_first_name:
          type: string
        manager_last_name:
          type: string
        manager_email:
          type: string
        deactivated:
          type: string
        status:
          type: string
        cost_center_name:
          type: string
        station:
          type: string
        driver_lic_num:
          type: string
        user_name:
          type: string
        date_disabled:
