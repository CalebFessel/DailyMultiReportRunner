openapi: 3.0.3
info:
  title: Traumasoft ThirdParty API
  version: 1.0.0
  description: |
    Partner-facing REST API for Traumasoft EMS integrations.

    This OpenAPI specification is the **source of truth** for ThirdParty Data and Lists endpoints.
    It supersedes the legacy Postman collection.

    ### Not included in this spec

    Private or non–partner integrations are **excluded** (use dedicated credentials / internal docs):

    - **Huly / ePCR** (`ThirdParty/Data/Epcr/Huly` and `Trip?rtype=HulyUpdateTrip`)
    - Hub, Banquest, ChatServer, SAML, Twilio, AniAli, and other non–Data/Lists ThirdParty surfaces

    Partner write-path enums/schemas still **deferred** until those endpoints are documented here:

    - **LocationTypeId** — ship when facility/location write paths are documented

    ---

    ## Authentication (HMAC-SHA256)

    All ThirdParty Data and Lists endpoints use HMAC authentication.
    Every request must send these headers:

    | Header | Description |
    | --- | --- |
    | **X-TS-APIKEY** | Configured API Key |
    | **X-TS-TIMESTAMP** | Current UNIX timestamp (valid for 300 seconds) |
    | **X-TS-ID** | Randomly generated number for every request |
    | **X-TS-AUTHORIZATION** | This is the generated HMAC hash |

    ### Generate hmac hash using

    **Default (most endpoints)**

    ```php
    hash_hmac('sha256', $requestBody . $timestamp . $randNum, $secret);
    ```

    Use an empty string for `$requestBody` when there is no body (typical GET).

    **Alternate (GPS Geofence / legacy Postman style)**

    ```php
    hash_hmac('sha256', $apiKey, $timestamp . $secret . $randNum);
    ```

    | Variable | Meaning |
    | --- | --- |
    | `$apiKey` | Same value as `X-TS-APIKEY` |
    | `$timestamp` | Same value as `X-TS-TIMESTAMP` |
    | `$randNum` | Same value as `X-TS-ID` |
    | `$secret` | The secret for that API key |
    | `$requestBody` | Raw HTTP body string |

    ---

    ## Rate limiting

    When per-API-key rate limiting is enabled, typical limits are:

    - **100** read requests / minute
    - **50** write requests / minute

    Clients may receive **HTTP 429** with a `Retry-After` header (commonly `60` seconds) when those limits are exceeded. Treat 429 as a transient condition and retry after the indicated wait.

    ---

    ## Routing conventions

    | Pattern | Maps to |
    |---------|---------|
    | `GET /ThirdParty/Data/{Controller}` | List |
    | `GET /ThirdParty/Data/{Controller}/{id}` | Read by ID |
    | `GET` or `POST` `...?rtype={Action}` | Custom action |
    | `GET /ThirdParty/Lists/...` | Dropdown lookups (`id` + `name`) |

    ---

    ## Write-only fields

    `ssn` is **write-only** and is never returned on GET/list responses
    (see `SsnField` on Users Create/Update).
servers:
  - url: '{baseUrl}/api'
    description: Tenant API base
    variables:
      baseUrl:
        default: https://your-tenant.traumasoft.com
        description: Your Traumasoft host (no trailing slash)
tags:
  - name: Attachments
    description: Upload files and list attachment types.
  - name: Billing
    description: Payor records with schedules and fees.
  - name: CAD
    description: CAD reference data, patients, facilities, and trips.
  - name: CAD Lists
    description: CAD dropdown lookups (id + name).
  - name: Fleet
    description: Vehicles and GPS geofence endpoints.
  - name: Fleet Lists
    description: Fleet dropdown lookups (id + name).
  - name: HR
    description: HR reference data endpoints.
  - name: HR Lists
    description: HR dropdown lookups (id + name).
  - name: Organization
    description: Division/district/group hierarchy with associated cost center IDs.
  - name: Schedule
    description: Shift assignments and punch data.
  - name: Schedule Lists
    description: Schedule dropdown lookups (id + name).
  - name: User
    description: Employee / user roster data.
  - name: User Lists
    description: User/employee dropdown lookups (id + name).
paths:
  /ThirdParty/Data/Attachments:
    get:
      summary: List attachment types
      tags:
      - Attachments
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Attachment types
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment_types:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttachmentType'
      parameters:
      - name: rtype
        in: query
        required: true
        schema:
          type: string
          enum:
          - GetTypes
    post:
      summary: Upload attachments
      tags:
      - Attachments
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      parameters:
      - name: rtype
        in: query
        required: true
        schema:
          type: string
          enum:
          - Upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttachmentUploadFile'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: string
                    description: Per-file status messages.
        '400':
          $ref: '#/components/responses/Error4xx'
  /ThirdParty/Data/Billing/FeeSchedules:
    get:
      summary: List FeeSchedule
      description: |
        Read-only lookup of billing fee schedules.
        Use `id` values when resolving fee_schedule on payor-related writes.
        Small reference list — returns all matching rows (no pagination).
        Excludes deleted and inactive fee schedules by default.
      tags:
      - Billing
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Fee schedules list
          content:
            application/json:
              schema:
                type: object
                required:
                - fee_schedules
                properties:
                  fee_schedules:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeeSchedule'
      parameters:
      - $ref: '#/components/parameters/nameFilter'
      - $ref: '#/components/parameters/includeDeleted'
      - $ref: '#/components/parameters/includeInactive'
  /ThirdParty/Data/Billing/PayorCategories:
    get:
      summary: List PayorCategory
      description: |
        Read-only lookup of payor categories.
        Use `id` values when resolving category on payor-related writes.
        Small reference list — returns all matching rows (no pagination).
      tags:
      - Billing
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Payor categories list
          content:
            application/json:
              schema:
                type: object
                required:
                - payor_categories
                properties:
                  payor_categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayorCategory'
      parameters:
      - $ref: '#/components/parameters/nameFilter'
  /ThirdParty/Data/Billing/Payors:
    get:
      summary: List Payor
      description: |
        Paginated payor list. System payors named NONE and BILL_PATIENT system-type
        rows are always excluded. Page size defaults to 100 (max 100). Optional sparse
        fields via `fields[payors]`.
      tags:
      - Billing
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JqGridPaginatorResponse'
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: '#/components/schemas/Payor'
        '400':
          $ref: '#/components/responses/Error4xx'
        '422':
          $ref: '#/components/responses/Error4xx'
      parameters:
      - $ref: '#/components/parameters/page'
      - name: rows
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: |
          Page size for Payors List. Defaults to 100 when omitted.
          Must be between 1 and 100 when provided.
      - $ref: '#/components/parameters/includeInactive'
      - $ref: '#/components/parameters/nameFilter'
      - $ref: '#/components/parameters/fieldsPayors'
    post:
      summary: Create Payor
      description: |
        Create a payor. Required: `name`, `system_type`, `primary_schedule_id`,
        `address1`, `city`, `state`, `zipcode`.
        `billing_desc` defaults to `name` when omitted; `payment_rate` defaults to 100.
        Reserved system payors cannot be created: name NONE, or `system_type` BILL_PATIENT (5).
        When `system_type` is INSURANCE (3), `default_source` is required and must exist.
        When `system_type` is FACILITY_CONTRACT (4), `facility_id` is required and must exist;
        after save, `ibd_facilities.payor_id` is set to the new payor (422 if the facility is
        already linked to a different payor).
        Optional FKs (`secondary_schedule_id`, `fee_schedule_id`, `category_id`) must exist when sent.
        `require_zip_plus_four_dropoff` always mirrors `require_zip_plus_four_pickup`.
        Writes are transaction-wrapped. Field diffs go to `cad_payors_history`
        (source: ThirdParty API).
      tags:
      - Billing
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayorCreate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '201':
          description: Created payor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayorWriteResponse'
        '422':
          $ref: '#/components/responses/Error4xx'
        '500':
          $ref: '#/components/responses/Error5xx'
  /ThirdParty/Data/Billing/Payors/{id}:
    get:
      summary: Read Payor by ID
      description: |
        Single payor by id. NONE (by name) and BILL_PATIENT system-type payors
        return 404. Optional sparse fields via `fields[payors]`.
      tags:
      - Billing
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Single record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payor'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
      - $ref: '#/components/parameters/fieldsPayors'
    put:
      summary: Update Payor
      description: |
        Partial update of a payor. Blank `name` → 422.
        NONE (by name) and BILL_PATIENT payors → 422 on all writes.
        FACILITY_CONTRACT payors with `facility_id` already set cannot be updated via this
        endpoint (422); the facility owns that link.
        Generic FACILITY_CONTRACT (`facility_id` null) may be updated without re-sending
        `facility_id`; linking a facility sets `ibd_facilities.payor_id` (422 if the facility
        is already linked to a different payor).
        Changing `system_type` to FACILITY_CONTRACT requires `facility_id`.
        Changing to / remaining INSURANCE requires `default_source` (existing value is kept
        when omitted on update).
        Optional FKs must exist when sent.
        `require_zip_plus_four_dropoff` always mirrors `require_zip_plus_four_pickup`.
      tags:
      - Billing
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayorWrite'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Updated payor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayorWriteResponse'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
        '500':
          $ref: '#/components/responses/Error5xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
    delete:
      summary: Deactivate Payor
      description: |
        Soft-deactivate a payor by setting `inactive=1`. Does not set `deleted`
        (unused for payors). NONE and BILL_PATIENT system payors → 422.
      tags:
      - Billing
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Deactivated payor
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  inactive:
                    type: boolean
                    example: true
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
        '500':
          $ref: '#/components/responses/Error5xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
  /ThirdParty/Data/Billing/Schedules:
    get:
      summary: List Schedule
      description: |
        Read-only lookup of billing schedules.
        Use `id` values when resolving schedule on payor and facility-related writes.
        Small reference list — returns all matching rows (no pagination).
        Excludes deleted schedules by default; pass `include_deleted=true` to include them.
      tags:
      - Billing
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Schedules list
          content:
            application/json:
              schema:
                type: object
                required:
                - schedules
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillingSchedule'
      parameters:
      - $ref: '#/components/parameters/nameFilter'
      - $ref: '#/components/parameters/includeDeleted'
  /ThirdParty/Data/Cad/CallTypes:
    get:
      summary: List CallType
      tags:
      - CAD
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatorResponse'
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: '#/components/schemas/CallType'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/rows'
      - $ref: '#/components/parameters/includeDeleted'
      - $ref: '#/components/parameters/nameFilter'
  /ThirdParty/Data/Cad/CallTypes/{id}:
    get:
      summary: Read CallType by ID
      tags:
      - CAD
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Single record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallType'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
  /ThirdParty/Data/Cad/CancelReasons:
    get:
      summary: List CancelReason
      tags:
      - CAD
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatorResponse'
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: '#/components/schemas/CancelReason'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/rows'
      - $ref: '#/components/parameters/includeDisabled'
      - $ref: '#/components/parameters/nameFilter'
  /ThirdParty/Data/Cad/CancelReasons/{id}:
    get:
      summary: Read CancelReason by ID
      tags:
      - CAD
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Single record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelReason'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
  /ThirdParty/Data/Cad/Departments:
    get:
      summary: List Department
      tags:
      - CAD
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatorResponse'
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: '#/components/schemas/Department'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/rows'
      - $ref: '#/components/parameters/includeDeleted'
      - $ref: '#/components/parameters/nameFilter'
      - name: facility_id
        in: query
        schema:
          type: integer
        description: Filter by facility. Resolve via GET /ThirdParty/Data/Cad/Facilities.
  /ThirdParty/Data/Cad/Departments/{id}:
    get:
      summary: Read Department by ID
      tags:
      - CAD
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Single record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
  /ThirdParty/Data/Cad/Facilities:
    get:
      summary: List Facility
      description: |
        Paginated list of facilities. Soft-deleted rows are excluded by default.
        `rows` defaults to 100 when omitted; when provided must be between 1 and 100 (400 otherwise).
        Optional `fields[facilities]` selects a subset of allowlisted columns (JSON:API style).
        Field names are matched case-insensitively. Omit `fields[facilities]` for the full
        allowlisted response. Unknown field names are ignored.
        If `fields[facilities]` is provided and none are allowlisted, returns 422.
        A non-object `fields` value returns 422.
        Optional `company_id` exact-matches `ibd_facilities.company_id`
        (resolve via GET /ThirdParty/Lists/Cad/Companies).
        When provided, `company_id` must be a positive integer; otherwise returns 422.
      tags:
      - CAD
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatorResponse'
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: '#/components/schemas/Facility'
        '400':
          $ref: '#/components/responses/Error4xx'
        '422':
          $ref: '#/components/responses/Error4xx'
      parameters:
      - $ref: '#/components/parameters/page'
      - name: rows
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: |
          Page size for Facilities List. Defaults to 100 when omitted.
          Must be between 1 and 100 when provided.
      - $ref: '#/components/parameters/includeDeleted'
      - $ref: '#/components/parameters/nameFilter'
      - $ref: '#/components/parameters/companyIdFilter'
      - $ref: '#/components/parameters/fieldsFacilities'
    post:
      summary: Create Facility
      description: |
        Create a facility. Required: `name`. `company_id` is optional.
        When `contract_payor` is provided: if a FACILITY_CONTRACT payor with that
        name already exists, attach it (`facility.payor_id` only; schedule not required)
        unless that payor already has `facility_id` set for a different facility (422).
        Otherwise create a new FACILITY_CONTRACT and require `primary_schedule_id`
        (must exist). Existing shared facility-contract payors are never mutated.
        Writes are transaction-wrapped. Field diffs go to `ibd_facilities_history`
        (source: ThirdParty API).
      tags:
      - CAD
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityCreate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '201':
          description: Created facility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityWriteResponse'
        '422':
          $ref: '#/components/responses/Error4xx'
        '500':
          $ref: '#/components/responses/Error5xx'
  /ThirdParty/Data/Cad/Facilities/{id}:
    get:
      summary: Read Facility by ID
      description: |
        Optional `fields[facilities]` selects a subset of allowlisted columns (JSON:API style).
        Field names are matched case-insensitively. Omit `fields[facilities]` for the full
        allowlisted response. Unknown field names are ignored.
        If `fields[facilities]` is provided and none are allowlisted, returns 422.
        A non-object `fields` value returns 422.
      tags:
      - CAD
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Single record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
      - $ref: '#/components/parameters/fieldsFacilities'
    put:
      summary: Update Facility
      description: |
        Partial update of a facility. Blank `name` → 422.
        When the linked CadPayors row already has `facility_id` set (specific contract),
        sending `contract_payor` to replace/rebind is blocked with 422. Otherwise
        `contract_payor` attaches an existing FACILITY_CONTRACT by name or creates a
        new one (same as Create). Facility field updates still sync an existing
        specific contract via the dedicated payor scenario.
        Delete is always allowed even when a linked payor exists.
      tags:
      - CAD
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityWrite'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Updated facility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityWriteResponse'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
        '500':
          $ref: '#/components/responses/Error5xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
    delete:
      summary: Delete Facility
      description: |
        Soft-delete a facility by setting `deleted=1` and `disabled=1`.
        Always allowed even when a linked contract payor exists.
      tags:
      - CAD
      security:
      - HmacApiKey: []
        HmacTimestamp: []
        HmacNonce: []
        HmacAuthorization: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimit429'
        '200':
          description: Soft-deleted facility
          content:
            application/json:
              schema:
                type: object
                properties:
                  facility_id:
                    type: integer
                    description: Same domain key as List/Read (`ibd_facilities.facility_id`).
                  deleted:
                    type: boolean
                  disabled:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Error4xx'
        '500':
          $ref: '#/components/responses/Error5xx'
      parameters:
      - $ref: '#/components/parameters/idPath'
