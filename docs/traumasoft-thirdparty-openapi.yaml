      properties:
        facility_id:
          type: integer
        company_id:
          type: integer
          description: Resolve via GET /ThirdParty/Lists/Cad/Companies.
        facility_type_id:
          type: integer
          description: Resolve via GET /ThirdParty/Data/Cad/FacilityTypes.
        name:
          type: string
        dba:
          type: string
        abbv:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        zipcode:
          type: string
        county_code:
          type: string
        phone:
          type: string
        fax_number:
          type: string
        email:
          type: string
        lat:
          type: number
        lon:
          type: number
        default_zone_id:
          type: integer
          description: Resolve via GET /ThirdParty/Data/Cad/Zones.
        default_subzone_id:
          type: integer
          description: Resolve via GET /ThirdParty/Data/Cad/Subzones.
        default_dispatch_subzone_id:
          type: integer
          description: Resolve via GET /ThirdParty/Data/Cad/Subzones.
        external_code:
          type: string
        npi:
          type: string
        disabled:
          type: string
        deleted:
          type: string
    FacilityCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        company_id:
          type: integer
          description: Optional. Resolve via GET /ThirdParty/Lists/Cad/Companies.
        facility_type_id:
          type: integer
          description: Resolve via GET /ThirdParty/Data/Cad/FacilityTypes.
        dba:
          type: string
        abbv:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        zipcode:
          type: string
        county_code:
          type: string
        country:
          type: string
        phone:
          type: string
        fax_number:
          type: string
        email:
          type: string
        lat:
          type: number
        lon:
          type: number
        default_zone_id:
          type: integer
          description: Resolve via GET /ThirdParty/Data/Cad/Zones.
        default_subzone_id:
          type: integer
          description: Resolve via GET /ThirdParty/Data/Cad/Subzones.
        default_dispatch_subzone_id:
